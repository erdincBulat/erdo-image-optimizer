<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Erdo Image Optimizer">
  <title>Erdo Image Optimizer</title>
  <style>
    .tile { fill: #0f5257; }
    .sky { fill: #1a6a6e; }
    .letter { fill: none; stroke: #fff; stroke-width: 24; stroke-linejoin: round; }
    .horizon {
      fill: none; stroke: #f0b429; stroke-width: 16;
      stroke-dasharray: 100 100; stroke-dashoffset: 0;
      animation: erdo-scan 6s cubic-bezier(.65, 0, .35, 1) infinite;
    }
    /* Wipe out to the right, sweep back in from the left, then rest. -200 is one full dash period, so 0 and -200 look identical. */
    @keyframes erdo-scan {
      0%, 4% { stroke-dashoffset: 0; }
      28%, 100% { stroke-dashoffset: -200; }
    }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect class="tile" width="256" height="256" rx="56"/>
  <!-- The "e": a rounded frame on a 16-unit grid (centerline 64-192), open at the lower right -->
  <path class="letter" d="M192 136V104A40 40 0 0 0 152 64H104A40 40 0 0 0 64 104V152A40 40 0 0 0 104 192H176"/>
  <!-- Upper counter = the picture: a lighter "sky" field above the horizon -->
  <path class="sky" d="M76 120V104A28 28 0 0 1 104 76H152A28 28 0 0 1 180 104V120Z"/>
  <!-- Crossbar = horizon line inside the frame -->
  <path class="horizon" d="M76 128H180" pathLength="100"/>
</svg>

# WordPress on nginx + PHP-FPM. matrix.ps1 writes the plugin's own
# ERDO_WebP_Server::get_nginx_config() output to /etc/nginx/erdo/webp.conf.
server {
    listen 80 default_server;
    root /var/www/html;
    index index.php;
    client_max_body_size 64m;

    include /etc/nginx/erdo/webp.conf;

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass 127.0.0.1:9000;
    }
}
